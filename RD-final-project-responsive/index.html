<!DOCTYPE html>

  <title>Final Project - Các đội tuyển LoL Esports</title>

<body>
  <header>
    <h1 id="top">Các đội tuyển LoL Esports</h1>

  <main>

    <div class="grid">
      <figure>
        <img src="images/liquid.jpg" alt="Đội tuyển Team Liquid ngồi trên ghế sofa đen trước phông nền xanh">
        <figcaption>Team Liquid</figcaption>
      </figure>
      <figure>
        <img src="images/t1.jpg" alt="Đội tuyển T1 mặc áo trắng đứng thành hàng trước phông nền tối">
        <figcaption>T1</figcaption>
      </figure>
      <figure>
        <img src="images/geng.jpg" alt="Đội tuyển Gen.G mặc áo khoác đen đứng trước nền màu cam">
        <figcaption>Gen.G</figcaption>
      </figure>
      <figure>
        <img src="images/blg.jpg" alt="Đội tuyển BLG mặc áo trắng xanh chụp banner quảng bá">
        <figcaption>BLG</figcaption>
      </figure>
      <figure>
        <img src="images/g2.jpg" alt="Đội tuyển G2 Esports khoanh tay trước nền đen và đỏ">

      </figure>
      <figure>

        <figcaption>AL</figcaption>
      </figure>
      <figure>
        <img src="images/invictus.jpg" alt="Đội tuyển Invictus Gaming mặc áo trắng trước nền xám">
        <figcaption>Invictus Gaming</figcaption>
      </figure>
      <figure>
        <img src="images/team8.jpg" alt="Đội tuyển HLE (Hanwha Life Esports) đứng trước tòa tháp và tòa nhà về đêm">
        <figcaption>HLE</figcaption>
      </figure>
